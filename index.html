<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventas CAV — Catálogo</title>
<meta name="description" content="Catálogo de productos seleccionados con amor.">
<meta property="og:title" content="Ventas CAV">
<meta property="og:description" content="Catálogo de productos seleccionados con amor.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: { sans: ['Inter','system-ui','sans-serif'] },
      colors: { brand: { DEFAULT: '#7c3aed', light: '#a78bfa', dark: '#5b21b6' } }
    }
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-slate-50 dark:bg-[#0a0a0f] text-slate-900 dark:text-slate-100 antialiased overflow-x-hidden">

<!-- Fondo decorativo -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
  <div class="bg-blob bg-violet-500 w-[500px] h-[500px] -top-40 -left-40"></div>
  <div class="bg-blob bg-fuchsia-500 w-[400px] h-[400px] top-1/3 -right-40"></div>
  <div class="bg-blob bg-pink-400 w-[380px] h-[380px] bottom-0 left-1/4"></div>
</div>

<!-- ============ HEADER ============ -->
<header id="header" class="glass sticky top-0 z-40 border-b border-slate-200/60 dark:border-slate-800/60 transition-shadow">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 gap-4">
      <!-- Logo -->
      <a href="#" class="flex items-center gap-2 shrink-0">
        <span id="logo" class="text-2xl">🛍️</span>
        <span id="nombre-tienda" class="font-bold text-lg tracking-tight">Ventas CAV</span>
      </a>

      <!-- Buscador desktop -->
      <div class="hidden md:flex flex-1 max-w-md relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="buscador" type="search" placeholder="Buscar productos..." class="w-full pl-10 pr-4 py-2 rounded-full bg-slate-100 dark:bg-slate-800/60 border border-transparent focus:border-violet-500 focus:bg-white dark:focus:bg-slate-900 outline-none text-sm transition-all">
      </div>

      <!-- Acciones -->
      <div class="flex items-center gap-1.5">
        <button id="theme-toggle" aria-label="Cambiar tema" class="p-2.5 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>

        <button id="btn-carrito" aria-label="Carrito" class="relative p-2.5 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          <span id="badge-carrito" class="hidden absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-gradient-to-br from-violet-600 to-fuchsia-500 text-white text-[10px] font-bold flex items-center justify-center">0</span>
        </button>
      </div>
    </div>

    <!-- Buscador mobile -->
    <div class="md:hidden pb-3">
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="buscador-mobile" type="search" placeholder="Buscar productos..." class="w-full pl-10 pr-4 py-2 rounded-full bg-slate-100 dark:bg-slate-800/60 outline-none text-sm">
      </div>
    </div>
  </div>
</header>

<!-- ============ HERO ============ -->
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-12 pb-8 text-center">
  <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight mb-4">
    Descubre lo <span class="bg-gradient-to-r from-violet-600 via-fuchsia-500 to-pink-500 bg-clip-text text-transparent">extraordinario</span>
  </h1>
  <p id="descripcion-tienda" class="text-base sm:text-lg text-slate-500 dark:text-slate-400 max-w-2xl mx-auto">
    Productos seleccionados con amor para ti
  </p>
</section>

<!-- ============ FILTROS ============ -->
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-6">
  <div class="flex flex-col gap-4">
    <!-- Categorías -->
    <div id="categorias" class="flex gap-2 overflow-x-auto no-scrollbar py-1"></div>

    <!-- Orden + info -->
    <div class="flex flex-wrap items-center justify-between gap-3">
      <p id="contador" class="text-sm text-slate-500 dark:text-slate-400"></p>
      <select id="orden" class="text-sm px-3 py-2 rounded-full bg-slate-100 dark:bg-slate-800/60 border border-transparent focus:border-violet-500 outline-none cursor-pointer">
        <option value="recientes">Más recientes</option>
        <option value="precio-asc">Precio: menor a mayor</option>
        <option value="precio-desc">Precio: mayor a menor</option>
        <option value="nombre">Nombre A-Z</option>
      </select>
    </div>
  </div>
</section>

<!-- ============ GRID ============ -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
  <div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6"></div>

  <!-- Sin resultados -->
  <div id="sin-resultados" class="hidden text-center py-20">
    <div class="text-5xl mb-4">🔍</div>
    <h3 class="font-semibold text-lg mb-1">Sin resultados</h3>
    <p class="text-sm text-slate-500">Prueba con otra búsqueda o categoría.</p>
  </div>

  <!-- Sentinel infinite scroll -->
  <div id="sentinel" class="h-20"></div>

  <!-- Loader -->
  <div id="loader" class="hidden flex justify-center py-8">
    <div class="w-8 h-8 rounded-full border-2 border-violet-500 border-t-transparent animate-spin"></div>
  </div>
</main>

<!-- ============ FOOTER ============ -->
<footer class="border-t border-slate-200 dark:border-slate-800 mt-10">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 grid sm:grid-cols-2 gap-6">
    <div>
      <div class="flex items-center gap-2 mb-3">
        <span id="logo-footer" class="text-xl">🛍️</span>
        <span id="nombre-footer" class="font-bold">Ventas CAV</span>
      </div>
      <p class="text-sm text-slate-500 dark:text-slate-400">Compra fácil por WhatsApp.</p>
    </div>
    <div class="sm:text-right">
      <div class="flex gap-3 sm:justify-end mb-3" id="footer-links"></div>
      <p class="text-xs text-slate-400">© <span id="anio"></span> Ventas CAV. Todos los derechos reservados.</p>
    </div>
  </div>
</footer>

<!-- ============ SCROLL TOP ============ -->
<button id="scroll-top" aria-label="Volver arriba" class="fixed bottom-6 right-6 z-30 p-3 rounded-full bg-white dark:bg-slate-800 shadow-lg border border-slate-200 dark:border-slate-700 opacity-0 pointer-events-none transition-all hover:scale-110">
  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
</button>

<!-- ============ CARRITO DRAWER ============ -->
<div id="cart-overlay" class="fixed inset-0 bg-black/60 modal-backdrop z-50 hidden"></div>
<aside id="cart-drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-white dark:bg-[#111118] z-50 shadow-2xl translate-x-full transition-transform duration-300 flex flex-col">
  <div class="flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-800">
    <h2 class="font-bold text-lg">Tu carrito</h2>
    <button id="cerrar-carrito" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>
  <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
  <div id="cart-footer" class="border-t border-slate-200 dark:border-slate-800 p-4 space-y-3">
    <div class="flex justify-between items-center">
      <span class="text-sm text-slate-500">Total</span>
      <span id="cart-total" class="font-bold text-xl">$0.00</span>
    </div>
    <button id="btn-whatsapp" class="btn-primary w-full py-3 rounded-xl text-white font-semibold flex items-center justify-center gap-2">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
      Pedir por WhatsApp
    </button>
    <button id="vaciar-carrito" class="w-full py-2 text-sm text-slate-500 hover:text-red-500 transition-colors">Vaciar carrito</button>
  </div>
</aside>

<!-- ============ MODAL PRODUCTO ============ -->
<div id="modal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/60 modal-backdrop" data-close-modal></div>
  <div class="relative h-full flex items-center justify-center p-4 overflow-y-auto">
    <div id="modal-content" class="scale-in relative bg-white dark:bg-[#111118] rounded-3xl max-w-3xl w-full overflow-hidden shadow-2xl my-8">
      <!-- contenido dinámico -->
    </div>
  </div>
</div>

  <!-- ============ BOTÓN FLOTANTE WHATSAPP ============ -->
<a id="btn-whatsapp-flotante"
   href="https://wa.me/15404780618?text=Hola%20Ventas%20CAV%2C%20me%20interesa%20un%20producto"
   target="_blank"
   rel="noopener"
   aria-label="Contactar por WhatsApp"
   class="whatsapp-float fixed bottom-6 left-6 z-30 w-14 h-14 rounded-full bg-gradient-to-br from-green-500 to-green-600 text-white shadow-2xl flex items-center justify-center hover:scale-110 active:scale-95 transition-transform">
  <svg class="w-7 h-7 relative z-10" viewBox="0 0 24 24" fill="currentColor">
    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
  </svg>
  <span class="whatsapp-pulse"></span>
</a>
  
<!-- ============ TOASTS ============ -->
<div id="toasts" class="fixed top-20 right-4 z-[60] space-y-2"></div>

<script src="js/app.js"></script>
</body>
</html>
